services:
  libflow-api:
    build:
      context: .
    image: slavanykonenko/libflow-api:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/libflow-api
    command: >
      sh -c "python manage.py wait_for_db &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/books/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16.11-alpine3.23
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - database:/var/lib/postgresql/data

  redis:
    image: redis:alpine3.22
    ports:
      - "6379:6379"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: "celery -A libflow_api worker -l INFO"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      libflow-api:
        condition: service_healthy
    restart: on-failure
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A libflow_api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - db
      - libflow-api
      - redis
    restart: on-failure
    env_file:
      - .env

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    command: "celery -A libflow_api flower --address=0.0.0.0 --port=5555"
    depends_on:
      - redis
      - celery
    env_file:
      - .env

  stripe_cli:
    image: stripe/stripe-cli:latest
    container_name: stripe_cli
    command: >
      listen --forward-to libflow-api:8000/api/payments/webhook/ 
      --api-key ${STRIPE_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      - libflow-api

volumes:
  database:
